on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python Statistics Scripts
        run: |
          python 4-statistics/task_excel.py
          python 4-statistics/task_2_spss.py

      - name: Install R Dependencies
        run: |
          install.packages(
            c("knitr", "rmarkdown", "tidyverse", "readxl", "ggplot2", "gridExtra", "reticulate")
          )
        shell: Rscript {0}

      - name: Run R Statistics Scripts
        run: |
          Rscript 4-statistics/task_excel.R
          Rscript 4-statistics/task_2_spss.R

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETICULATE_PYTHON: ${{ env.pythonLocation }}/bin/python
