on:
  workflow_dispatch:
  push:
    branches: main

name: Quarto Publish

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/itsleeds/tds:latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Python Statistics Scripts
        run: |
          python 4-statistics/task_excel.py
          python 4-statistics/task_2_spss.py

      - name: Run R Statistics Scripts
        run: |
          Rscript 4-statistics/task_excel.R
          Rscript 4-statistics/task_2_spss.R

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
