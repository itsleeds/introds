name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/itsleeds/tds:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run Python Statistics Scripts
        run: |
          python 4-statistics/task_excel.py
          python 4-statistics/task_2_spss.py

      - name: Run R Statistics Scripts
        run: |
          Rscript 4-statistics/task_excel.R
          Rscript 4-statistics/task_2_spss.R

      - name: Render Quarto Project
        run: quarto render

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: _site/
